services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stabsstod}
      POSTGRES_DB: ${POSTGRES_DB:-stabsstod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:5432:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-stabsstod}@db:5432/${POSTGRES_DB:-stabsstod}
      NODE_ENV: production
      PORT: '3000'
      HOST: '0.0.0.0'
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TZ: ${TZ:-Europe/Stockholm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stabsstod}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-stabsstod}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-long-random-string}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ATTACHMENTS_DIR: /data/attachments
      MAPS_DIR: /app/data/maps
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - attachments:/data/attachments
      - ./data/maps:/app/data/maps:ro

volumes:
  pgdata:
  attachments:
